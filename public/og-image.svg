<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2F2F7"/>
      <stop offset="100%" style="stop-color:#E8EDF5"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f9f9fb"/>
    </linearGradient>
    <linearGradient id="ring-safe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759"/>
      <stop offset="100%" style="stop-color:#28A745"/>
    </linearGradient>
    <linearGradient id="ring-warn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F0A"/>
      <stop offset="100%" style="stop-color:#E08800"/>
    </linearGradient>
    <linearGradient id="ring-bad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30"/>
      <stop offset="100%" style="stop-color:#D32F2F"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0070F3"/>
      <stop offset="100%" style="stop-color:#007AFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
    <clipPath id="card-clip"><rect x="0" y="0" width="320" height="160" rx="20"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#C7C7CC" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left panel — branding -->
  <g transform="translate(90, 200)">
    <!-- Logo mark -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#007AFF"/>
    <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">S</text>

    <!-- Brand name -->
    <text x="72" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E" letter-spacing="-0.3">Sift</text>
    <text x="72" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#8E8E93" letter-spacing="0.5">INDIA'S AI FOOD SAFETY APP</text>

    <!-- Headline -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#1C1C1E" letter-spacing="-1">Know what's</text>
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#1C1C1E" letter-spacing="-1">really in your</text>
    <text x="0" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#007AFF" letter-spacing="-1">food.</text>

    <!-- Subline -->
    <text x="0" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#6D6D72">Instant AI safety scores for 1,000+ Indian</text>
    <text x="0" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#6D6D72">products. FSSAI checked. No guesswork.</text>

    <!-- CTA chip -->
    <rect x="0" y="320" width="200" height="44" rx="22" fill="#007AFF"/>
    <text x="100" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="middle">Scan a Product →</text>
  </g>

  <!-- Right panel — product cards mockup -->
  <g transform="translate(640, 80)">

    <!-- Card 1 — Safe -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="460" height="110" rx="20" fill="url(#card)"/>
      <!-- Score ring -->
      <circle cx="55" cy="55" r="32" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="55" cy="55" r="32" fill="none" stroke="url(#ring-safe)" stroke-width="6"
        stroke-dasharray="145 56" stroke-dashoffset="40" stroke-linecap="round"/>
      <text x="55" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#34C759" text-anchor="middle">87</text>
      <text x="55" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34C759" text-anchor="middle">A</text>
      <!-- Product info -->
      <text x="100" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1C1C1E">Tata Tea Gold</text>
      <text x="100" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8E8E93">Tata Consumer Products</text>
      <rect x="100" y="68" width="48" height="20" rx="10" fill="#F0FBF4"/>
      <text x="124" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1E8040" text-anchor="middle">Safe</text>
    </g>

    <!-- Card 2 — Moderate -->
    <g transform="translate(0, 130)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="460" height="110" rx="20" fill="url(#card)"/>
      <circle cx="55" cy="55" r="32" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="55" cy="55" r="32" fill="none" stroke="url(#ring-warn)" stroke-width="6"
        stroke-dasharray="120 81" stroke-dashoffset="40" stroke-linecap="round"/>
      <text x="55" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FF9F0A" text-anchor="middle">62</text>
      <text x="55" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF9F0A" text-anchor="middle">B</text>
      <text x="100" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1C1C1E">Maggi 2-Minute Noodles</text>
      <text x="100" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8E8E93">Nestle India</text>
      <rect x="100" y="68" width="72" height="20" rx="10" fill="#FFF8E6"/>
      <text x="136" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#B87800" text-anchor="middle">Moderate</text>
    </g>

    <!-- Card 3 — Unsafe -->
    <g transform="translate(0, 260)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="460" height="110" rx="20" fill="url(#card)"/>
      <circle cx="55" cy="55" r="32" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="55" cy="55" r="32" fill="none" stroke="url(#ring-bad)" stroke-width="6"
        stroke-dasharray="67 134" stroke-dashoffset="40" stroke-linecap="round"/>
      <text x="55" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FF3B30" text-anchor="middle">34</text>
      <text x="55" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF3B30" text-anchor="middle">D</text>
      <text x="100" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1C1C1E">Parle-G Gold Biscuits</text>
      <text x="100" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8E8E93">Parle Products</text>
      <rect x="100" y="68" width="52" height="20" rx="10" fill="#FFF0EE"/>
      <text x="126" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#CC1010" text-anchor="middle">Unsafe</text>
    </g>

    <!-- Card 4 — FSSAI badge row -->
    <g transform="translate(0, 390)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="460" height="80" rx="20" fill="url(#card)"/>
      <text x="22" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">Powered by</text>
      <text x="22" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3C3C43">FSSAI · WHO · ICMR-NIN · Gemini AI</text>
      <rect x="340" y="20" width="100" height="40" rx="12" fill="rgba(0,122,255,0.08)"/>
      <text x="390" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#007AFF" text-anchor="middle">Free · India</text>
    </g>
  </g>

  <!-- Bottom divider line -->
  <line x1="90" y1="595" x2="1110" y2="595" stroke="#C7C7CC" stroke-width="0.5" opacity="0.5"/>
  <text x="90" y="617" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8E8E93">sift-india.vercel.app</text>
  <text x="1110" y="617" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8E8E93" text-anchor="end">India's AI Product Safety Scanner</text>
</svg>
